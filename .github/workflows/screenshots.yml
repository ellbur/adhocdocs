# Screenshots of the viewer, taken the same way every time on a virtual
# screen (tools/screenshots/, docs/SCREENSHOTS.md). Nothing here talks to
# Claude. The pictures are uploaded as the run's "screenshots" artifact,
# with index.html to look through them.
name: Screenshots

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "viewer/**"
      - "src/**"
      - "corpus/**"
      - "tools/screenshots/**"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev clang pkg-config build-essential \
            xvfb xdotool imagemagick x11-utils jq \
            tesseract-ocr tesseract-ocr-eng \
            fonts-dejavu-core fonts-liberation

      - uses: astral-sh/setup-uv@v6

      - name: Cache the viewer's build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            viewer/target
          key: viewer-${{ runner.os }}-${{ hashFiles('viewer/Cargo.lock', 'viewer/rust-toolchain.toml') }}-${{ hashFiles('viewer/src/**', 'viewer/shell/**') }}
          restore-keys: |
            viewer-${{ runner.os }}-${{ hashFiles('viewer/Cargo.lock', 'viewer/rust-toolchain.toml') }}-

      - name: Build the viewer
        working-directory: viewer
        run: cargo build --release --locked

      - name: Python environment
        run: uv sync --locked

      - name: Take the screenshots
        run: uv run python tools/screenshots/shoot.py --out screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn
