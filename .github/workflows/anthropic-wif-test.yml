# Checks Workload Identity Federation with Anthropic (docs/SCREENSHOTS.md):
# that a job in the `recording` environment can exchange GitHub's OIDC token
# for an Anthropic access token, and that Claude Code can authenticate with
# the federation variables alone (no API key). Delete once recording works.
name: anthropic-wif-test

on:
  push:
    paths:
      - ".github/workflows/anthropic-wif-test.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  wif:
    runs-on: ubuntu-24.04
    environment: recording
    env:
      # Not secrets: they name the rule; GitHub's token is what proves who we are.
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01RQ8H1TGq1jrpQPU1USQNVc
      ANTHROPIC_ORGANIZATION_ID: 4058960a-0194-49f4-9aba-c1ecd72eee63
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01GW7npfayKyshbYHbBo1ptL
      ANTHROPIC_WORKSPACE_ID: wrkspc_01M99kgeArpA3BQJ1iPSuuaP
      ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/anthropic-gha-jwt
    steps:
      - name: Fetch a GitHub OIDC token
        # Each token can be exchanged once (its jti) and lasts about 5 minutes,
        # so each step that exchanges one fetches its own.
        run: |
          fetch() {
            curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value
          }
          fetch > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          # The claims the federation rule matches (not secret; the signature is what matters).
          cut -d. -f2 "$ANTHROPIC_IDENTITY_TOKEN_FILE" | tr '_-' '/+' | base64 -d 2>/dev/null \
            | jq '{iss, sub, aud, repository, repository_owner, ref, environment}' || true

      - name: Exchange it for an Anthropic access token
        run: |
          jwt=$(cat "$ANTHROPIC_IDENTITY_TOKEN_FILE")
          jq -n --arg jwt "$jwt" '{
            grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
            assertion: $jwt,
            federation_rule_id: env.ANTHROPIC_FEDERATION_RULE_ID,
            organization_id: env.ANTHROPIC_ORGANIZATION_ID,
            service_account_id: env.ANTHROPIC_SERVICE_ACCOUNT_ID,
            workspace_id: env.ANTHROPIC_WORKSPACE_ID
          }' | curl -sS https://api.anthropic.com/v1/oauth/token \
                 -H "content-type: application/json" --data @- > "$RUNNER_TEMP/exchange.json"
          jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)' "$RUNNER_TEMP/exchange.json"
          jq -e '.access_token | startswith("sk-ant-oat01-")' "$RUNNER_TEMP/exchange.json" > /dev/null

      - name: The API with a federated token, with what Claude Code adds to a request
        # Opus 5.5 with max_tokens 128000 goes through with this token, but the request Claude
        # Code makes believing it has an API key (a recording's) is refused, "Your credit
        # balance is too low". Which of what it adds does that? Each line adds one thing to a
        # small Haiku request; the last ones add everything, as Claude Code sends it.
        run: |
          token=$(jq -r .access_token "$RUNNER_TEMP/exchange.json")
          small='{"model": "claude-haiku-5-5", "max_tokens": 16, "messages": [{"role": "user", "content": "Say ok."}]}'
          ask() {   # label, body, path, then extra curl arguments
            label=$1 body=$2 path=$3; shift 3
            code=$(curl -sS -o "$RUNNER_TEMP/out.json" -w "%{http_code}" "https://api.anthropic.com$path" \
              -H "authorization: Bearer $token" -H "anthropic-version: 2023-06-01" \
              -H "content-type: application/json" "$@" -d "$body")
            echo "$label: $code $(jq -c '.error.message // [.content[]?.text]' "$RUNNER_TEMP/out.json")"
          }
          betas="claude-code-20250219,interleaved-thinking-2025-05-14,context-management-2025-06-27,per-turn-control-2026-07-01,mid-conversation-tool-changes-2026-07-01,thinking-token-count-2026-05-13,advanced-tool-use-2025-11-20,effort-2025-11-24,thinking-display-updates-2026-08-18"
          ask "plain" "$small" /v1/messages
          ask "oauth beta" "$small" /v1/messages -H "anthropic-beta: oauth-2025-04-20"
          for b in ${betas//,/ }; do
            ask "beta $b" "$small" "/v1/messages?beta=true" -H "anthropic-beta: $b"
            ask "beta $b + oauth" "$small" "/v1/messages?beta=true" -H "anthropic-beta: $b,oauth-2025-04-20"
          done
          ask "browser access header" "$small" /v1/messages -H "anthropic-dangerous-direct-browser-access: true"
          ask "x-app cli + user agent" "$small" /v1/messages -H "x-app: cli" -H "user-agent: claude-cli/2.1.325 (external, sdk-cli)"
          ask "?beta=true" "$small" "/v1/messages?beta=true"
          full='{"model": "claude-opus-5-5", "max_tokens": 128000, "thinking": {"type": "adaptive", "display": "omitted"},
                 "context_management": {"edits": [{"type": "clear_thinking_20251015", "keep": "all"}]},
                 "output_config": {"effort": "medium"}, "messages": [{"role": "user", "content": "Say ok."}]}'
          ask "Claude Code's options, Opus" "$full" "/v1/messages?beta=true" -H "anthropic-beta: context-management-2025-06-27,effort-2025-11-24"
          everything=(-H "anthropic-beta: $betas,oauth-2025-04-20" -H "anthropic-dangerous-direct-browser-access: true"
                      -H "x-app: cli" -H "user-agent: claude-cli/2.1.325 (external, sdk-cli)")
          ask "everything, Opus" "$full" "/v1/messages?beta=true" "${everything[@]}"
          everything[1]="anthropic-beta: $betas"
          ask "everything but oauth, Opus" "$full" "/v1/messages?beta=true" "${everything[@]}"

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Claude Code, authenticated by federation alone
        run: |
          # A fresh token: the first was used up by the exchange above.
          curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value \
            > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN
          claude --version
          claude -p "Reply with exactly the word: federated" --max-turns 1 | tee "$RUNNER_TEMP/reply.txt"
          grep -qi federated "$RUNNER_TEMP/reply.txt"
