# Record scenarios' sessions with Claude Code for real (tools/screenshots/,
# docs/SCREENSHOTS.md), replay what was recorded as a check, and open a pull
# request with the new recordings. Started by hand (Run workflow), and only
# after someone approves the `recording` environment: the job signs in to
# the Claude API with Workload Identity Federation, whose rule trusts that
# environment of this repository and nothing else. No key is stored anywhere.
name: Record sessions

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Scenarios to record, by name, space-separated (blank: all of them)"
        required: false
        default: ""

permissions:
  contents: write          # push the recordings' branch
  pull-requests: write     # open the pull request
  id-token: write          # GitHub's token, exchanged for a short-lived Claude API token

concurrency: record-sessions

jobs:
  record:
    runs-on: ubuntu-24.04
    environment: recording
    timeout-minutes: 120
    env:
      # Not secrets: they name the federation rule; GitHub's signed token is what proves who we are.
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01LFv4oFVEoQbBZpvELuVXcy
      ANTHROPIC_ORGANIZATION_ID: 4058960a-0194-49f4-9aba-c1ecd72eee63
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01S3T4sHCaBQrxS26ZShCG6Z
      ANTHROPIC_WORKSPACE_ID: wrkspc_01M99kgeArpA3BQJ1iPSuuaP
      SCENARIOS: ${{ inputs.scenarios }}
    steps:
      - name: Scenario names
        # blank (every scenario) is fine
        run: |
          if [[ ! "$SCENARIOS" =~ ^[a-z0-9\ _-]*$ ]]; then
            echo "Scenario names are lowercase letters, digits, - and _, separated by spaces." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev clang pkg-config build-essential \
            xvfb xdotool imagemagick x11-utils jq ffmpeg \
            tesseract-ocr tesseract-ocr-eng \
            fonts-dejavu-core fonts-liberation

      - uses: astral-sh/setup-uv@v6

      - name: Cache the viewer's build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            viewer/target
          key: viewer-${{ runner.os }}-${{ hashFiles('viewer/Cargo.lock', 'viewer/rust-toolchain.toml') }}-${{ hashFiles('viewer/src/**', 'viewer/shell/**') }}
          restore-keys: |
            viewer-${{ runner.os }}-${{ hashFiles('viewer/Cargo.lock', 'viewer/rust-toolchain.toml') }}-

      - name: Build the viewer
        working-directory: viewer
        run: cargo build --release --locked

      - name: Python environment
        run: uv sync --locked

      - name: The sample matter
        run: uv run python -c "import sys; sys.path.insert(0, 'tools/screenshots'); import harness, os, pathlib; harness.make_matter(pathlib.Path('/tmp/shots/sample-matter'), {**os.environ, **harness.base_env()})"

      - name: The session image
        run: |
          podman build --build-arg CLAUDE_CODE_VERSION="$(cat tools/screenshots/claude-code-version)" \
            -f container/Containerfile -t localhost/adhocdocs:latest .

      - name: Record
        # $SCENARIOS unquoted on purpose: a list of names (checked above)
        run: uv run python tools/screenshots/scenario.py record $SCENARIOS --matter /tmp/shots/sample-matter --out recorded

      - name: Replay what was recorded
        run: uv run python tools/screenshots/scenario.py replay $SCENARIOS --matter /tmp/shots/sample-matter --out screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recorded-sessions
          path: |
            recorded/
            screenshots/
          if-no-files-found: warn

      - name: Pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- tools/screenshots/scenarios; then
            echo "The recordings didn't change."
            exit 0
          fi
          branch="recordings/run-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add tools/screenshots/scenarios/*.cassette.json
          git commit -q -m "Recordings: ${SCENARIOS:-every scenario}" -m "Recorded by $RUN_URL"
          git push -q origin "$branch"
          {
            echo "New recordings of ${SCENARIOS:-every scenario}, made by [this run]($RUN_URL) with Claude Code $(cat tools/screenshots/claude-code-version)."
            echo
            echo "Each was replayed in the same run, and passed the check that its tools print what was recorded."
            echo "Before merging, watch the videos: the run's **recorded-sessions** artifact (screenshots/NAME.mp4), and read what Claude said in each."
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base "$BASE" --head "$branch" --title "Recordings: ${SCENARIOS:-every scenario}" --body-file "$RUNNER_TEMP/body.md"
