# The entity layer's main loop: select a name you don't know, ask Claude
# "Who's this?", and Claude looks the person up, records them as an entity,
# and answers with their card, open at the name (view card): the summary and
# the passages it rests on, there to check. The person opens one.
caption = "Asking Claude who someone is: it answers with the person's card, citing the passages to check."

[screen]
size = [1600, 1000]

[pace]
think = 1.2
cps = 180
typing_ms = 45

# Off camera: the user has the Dock 4 camera review notes open.
[[setup]]
view = ["open", "{doc:kettering-t/dock4-camera-review-notes.txt}", "--new-pane"]

[[step]]
pause = 1.0

[[step]]
select = { text = "Jose Ibanez", pane = { kind = "document" } }

[[step]]
pause = 0.8

[[step]]
prompt = "Who's this?"

[[step]]
shot = "answer"
caption = "Claude recorded him as an entity and opened his card at his name: a summary, and the passages it rests on."

[[step]]
pause = 1.2

# checking it: the deposition passage the card cites
[[step]]
click = { selector = "#entity-card .ec-see", nth = 1 }

# out of the way of the text, so no card opens under the pointer
[[step]]
hover = { selector = ".side-h", pane = { kind = "document" } }

[[step]]
pause = 1.2

[[step]]
shot = "evidence"
caption = "A passage the card cites, opened and highlighted: Kettering's deposition."

[[step]]
pause = 1.5
