[package]
name = "adhoc-viewer"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "The adhocdocs document viewer"

[[bin]]
name = "adhoc-viewer"
path = "src/main.rs"

[dependencies]
wry = "0.53"
tao = "0.34"
mupdf = "0.8"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ammonia = "4"
base64 = "0.22"
percent-encoding = "2"
sha2 = "0.10"
libc = "0.2"
