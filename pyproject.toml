[project]
name = "adhocdocs"
version = "0.1.0"
description = "Tools for working with evidentiary documents from Claude Code"
authors = [
    { name = "Owen Healy", email = "owen@owenehealy.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastembed>=0.9.1",
    "lxml>=6.1.3",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "numpy>=2.5.4",
    "pymupdf>=2.0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
adhoc = "adhocdocs.cli:adhoc"
idx = "adhocdocs.cli:idx"
search = "adhocdocs.cli:search"
layers = "adhocdocs.cli:layers"
text = "adhocdocs.cli:text"
list = "adhocdocs.cli:list_"
ann = "adhocdocs.cli:ann"
page = "adhocdocs.cli:page"
view = "adhocdocs.cli:view"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
